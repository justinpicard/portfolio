<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (performance.getEntriesByType('navigation')[0]?.type === 'reload') {
        // Prevent native mid-page restoration while the intro starts again.
        history.scrollRestoration = 'manual'
        if (location.hash) {
          history.replaceState(history.state, '', location.pathname + location.search)
        }
        const resetReloadScroll = () => window.scrollTo(0, 0)
        resetReloadScroll()
        document.addEventListener('DOMContentLoaded', resetReloadScroll, { once: true })
        window.addEventListener('pageshow', (event) => {
          if (!event.persisted) resetReloadScroll()
        }, { once: true })
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
